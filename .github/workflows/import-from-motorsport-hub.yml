name: Import Club Pulse from Motorsport Hub

on:
  push:
    branches:
      - migration/import-from-motorsport-hub
    paths:
      - '.github/workflows/import-from-motorsport-hub.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Club Pulse migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/import-from-motorsport-hub
          fetch-depth: 0

      - name: Checkout exact Motorsport Hub source snapshot
        uses: actions/checkout@v4
        with:
          repository: 48wr9f4wgp-lab/motorsport-hub
          ref: 9e869fdae85e9ee352234b925c733065eb7c24fd
          path: _source
          fetch-depth: 0

      - name: Verify launcher-pinned sources against export snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,subprocess,sys
          source=pathlib.Path('_source')
          launcher=(source/'scriptable/club-pulse.js').read_text()
          refs=re.findall(r'https://raw\.githubusercontent\.com/48wr9f4wgp-lab/motorsport-hub/([0-9a-f]{7,40})/(scriptable/[^\'\"]+)',launcher)
          if not refs:
              raise SystemExit('No pinned Club Pulse runtime refs found')
          seen=set(); broken=[]
          for sha,path in refs:
              key=(sha,path)
              if key in seen: continue
              seen.add(key)
              current=(source/path).read_bytes()
              try:
                  historical=subprocess.check_output(['git','-C',str(source),'show',f'{sha}:{path}'],stderr=subprocess.DEVNULL)
                  resolved=sha
                  mode='PINNED'
              except subprocess.CalledProcessError:
                  resolved=subprocess.check_output(['git','-C',str(source),'log','-1','--format=%H','--',path],text=True).strip()
                  if not resolved:
                      print(f'BROKEN REF WITH NO HISTORY {sha} {path}',file=sys.stderr)
                      raise SystemExit(1)
                  historical=subprocess.check_output(['git','-C',str(source),'show',f'{resolved}:{path}'])
                  mode='REPAIRED-BROKEN-REF'
                  broken.append((sha,path,resolved))
              if current!=historical:
                  print(f'MISMATCH {mode} old={sha} resolved={resolved} path={path}',file=sys.stderr)
                  raise SystemExit(1)
              print(f'OK {mode} old={sha} resolved={resolved} {path}')
          pathlib.Path('.migration-broken-refs.txt').write_text(''.join(f'{old}\t{path}\t{resolved}\n' for old,path,resolved in broken))
          print(f'Verified {len(seen)} pinned runtime files against export snapshot; repaired refs={len(broken)}')
          PY

      - name: Import exact Club Pulse product tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scriptable
          cp -R _source/scriptable ./scriptable
          rm -rf _source
          rm -f MIGRATION_SENTINEL.md README.migration-note.md MIGRATION_PLAN.md TEMP.md
          mkdir -p .github/workflows
          cat > .github/workflows/club-pulse-contract.yml <<'YAML'
          name: Club Pulse Contract QA

          on:
            push:
              branches:
                - main
                - migration/import-from-motorsport-hub
              paths:
                - 'scriptable/**'
                - '.github/workflows/club-pulse-contract.yml'
            pull_request:
              branches:
                - main
              paths:
                - 'scriptable/**'
                - '.github/workflows/club-pulse-contract.yml'

          permissions:
            contents: read

          jobs:
            contract:
              runs-on: ubuntu-latest
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                    package-manager-cache: false
                - name: Run all Club Pulse contract tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    for test in scriptable/*.test.js; do
                      echo "::group::$test"
                      node "$test"
                      echo "::endgroup::"
                    done
          YAML
          cat > README.md <<'EOF'
          # Club Pulse

          Club Pulse is the dedicated Scriptable football-club widget project extracted from the former mixed `motorsport-hub` repository.

          The product implementation lives in `scriptable/`. The canonical launcher is `scriptable/club-pulse.js`.

          ## Migration provenance

          This repository was migrated from `48wr9f4wgp-lab/motorsport-hub` using exact source snapshot `9e869fdae85e9ee352234b925c733065eb7c24fd` on 2026-09-14.

          The migration verifies every runtime file pinned by the launcher against its historical immutable source before repinning the launcher to this repository. A malformed historical ref is repaired only when the latest real file revision reachable at the export snapshot is byte-for-byte identical to the exported file.

          ## Validation

          `.github/workflows/club-pulse-contract.yml` runs all `scriptable/*.test.js` contract/regression checks.

          ## License

          No software license is granted by this migration. Club Pulse licensing is intentionally independent from Motorsport Hub's MPL-2.0 decision.
          EOF
          cat > MIGRATION_SOURCE.md <<'EOF'
          # Club Pulse migration source

          - Source repository: `48wr9f4wgp-lab/motorsport-hub`
          - Exact source commit: `9e869fdae85e9ee352234b925c733065eb7c24fd`
          - Exported path: `scriptable/`
          - Migration date: 2026-09-14

          Before repinning runtime URLs, the migration workflow compares every launcher-pinned historical file with the file at the exact export snapshot. Any content mismatch fails the migration.
          EOF
          if [ -s .migration-broken-refs.txt ]; then
            {
              echo
              echo '## Repaired malformed historical refs'
              echo
              echo 'The following launcher refs did not resolve as Git objects. Each replacement was accepted only after the latest real historical revision was byte-for-byte identical to the exported snapshot:'
              echo
              while IFS=$'\t' read -r old path resolved; do
                printf -- '- `%s` → `%s` for `%s`\n' "$old" "$resolved" "$path"
              done < .migration-broken-refs.txt
            } >> MIGRATION_SOURCE.md
          fi
          rm -f .migration-broken-refs.txt

      - name: Commit exact imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md MIGRATION_SOURCE.md scriptable .github/workflows/club-pulse-contract.yml
          git add -u
          git commit -m 'Import exact Club Pulse snapshot from Motorsport Hub'
          echo "IMPORT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Re-pin launcher and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib,re
          import_sha=os.environ['IMPORT_SHA']
          launcher_path=pathlib.Path('scriptable/club-pulse.js')
          launcher=launcher_path.read_text()
          refs=re.findall(r'https://raw\.githubusercontent\.com/48wr9f4wgp-lab/motorsport-hub/([0-9a-f]{7,40})/(scriptable/[^\'\"]+)',launcher)
          old_shas={sha for sha,_ in refs}
          launcher=re.sub(
              r'https://raw\.githubusercontent\.com/48wr9f4wgp-lab/motorsport-hub/[0-9a-f]{7,40}/(scriptable/[^\'\"]+)',
              lambda m:f'https://raw.githubusercontent.com/48wr9f4wgp-lab/club-pulse/{import_sha}/{m.group(1)}',
              launcher,
          )
          launcher_path.write_text(launcher)
          changed_tests=[]
          for test_path in pathlib.Path('scriptable').glob('*.test.js'):
              test=test_path.read_text()
              original=test
              for sha in sorted(old_shas,key=len,reverse=True):
                  test=test.replace(sha,import_sha)
              test=test.replace('48wr9f4wgp-lab/motorsport-hub','48wr9f4wgp-lab/club-pulse')
              if test!=original:
                  test_path.write_text(test)
                  changed_tests.append(test_path.name)
          with pathlib.Path('MIGRATION_SOURCE.md').open('a') as f:
              f.write(f'\n- Imported immutable snapshot commit in this repository: `{import_sha}`\n')
              f.write('- Launcher runtime URLs were repinned to that immutable snapshot after byte-for-byte parity verification.\n')
              f.write(f'- Pin/repository contract tests updated for the destination repository: {", ".join(changed_tests)}\n')
          print('Updated destination contracts:', ', '.join(changed_tests) or '(none)')
          PY

      - name: Run all Club Pulse tests before publishing migration branch
        shell: bash
        run: |
          set -euo pipefail
          for test in scriptable/*.test.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          if grep -R "raw.githubusercontent.com/48wr9f4wgp-lab/motorsport-hub" scriptable/club-pulse.js; then
            echo 'Launcher still depends on Motorsport Hub raw runtime URLs' >&2
            exit 1
          fi

      - name: Finalize migration branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-from-motorsport-hub.yml
          git add -A
          git commit -m 'Re-pin Club Pulse runtime to dedicated repository'
          git push origin HEAD:migration/import-from-motorsport-hub

# Registered on default branch; touching this file triggers the one-shot migration.
